name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Code Quality, Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Lint & Typecheck Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff flake8 mypy pandas pydantic scikit-learn imbalanced-learn fastapi joblib python-dotenv xgboost

      - name: Run Ruff Check & Format Verification
        run: |
          python -m ruff check src tests main.py
          python -m ruff format --check src tests main.py

      - name: Run Flake8
        run: python -m flake8 --max-line-length=120 src tests main.py

      - name: Run Mypy Typecheck
        run: python -m mypy --explicit-package-bases src main.py

  test:
    name: Automated Test Suite (Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest with Coverage Gate
        run: python -m pytest tests/ -v --cov=src --cov-report=term-missing --cov-fail-under=75

      - name: Verify CLI Health & Demo Smoke
        run: |
          python main.py --health
          python main.py --demo --synthetic --horizon both --threshold 0.30

  build-and-security:
    name: Docker Build & Security Scans
    needs: [lint-and-typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST Scanner
        uses: returntocorp/semgrep-action@v1
        continue-on-error: true
        with:
          config: p/python

      - name: Build Hardened Docker Image
        run: docker build -t latepay-detector:ci .

      - name: Run Trivy Container Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: latepay-detector:ci
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
