[project]
name = "credit-card-latepay-detector"
version = "1.0.0"
description = "Recall-oriented credit card delinquency prediction pipeline and inference API."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["*.ipynb", ".venv", "venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*.ipynb"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
explicit_package_bases = true
namespace_packages = true
