services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: latepay-detector-api
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      LOG_LEVEL: INFO
      LATEPAY_HORIZON: 6m
      LATEPAY_MODEL_TYPE: logreg
      LATEPAY_THRESHOLD: "0.30"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
